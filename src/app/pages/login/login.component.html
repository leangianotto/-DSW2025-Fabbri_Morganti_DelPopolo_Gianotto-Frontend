<div class="container mt-5" style="max-width: 400px">
  <h2 class="mb-4 text-center fw-bold">Iniciar sesión</h2>

  <!-- Mensaje de bloqueo -->
  <div *ngIf="blocked" class="alert alert-danger text-center fw-bold">
    Demasiados intentos. Podrás volver a intentar en
    {{ blockSeconds }} segundos.
  </div>

  <form (ngSubmit)="onSubmit()" #loginForm="ngForm" novalidate>
    <!-- Email -->
    <div class="mb-3">
      <label for="email" class="form-label">Email:</label>
      <input
        id="email"
        type="email"
        class="form-control"
        [(ngModel)]="email"
        name="email"
        required
        email
        #emailInput="ngModel"
        [disabled]="blocked || loading"
        [class.is-invalid]="emailInput.invalid && emailInput.touched"
        data-testid="email-input"
      />
      <div
        *ngIf="emailInput.invalid && emailInput.touched"
        class="invalid-feedback"
      >
        <div *ngIf="emailInput.errors?.['required']">
          El email es obligatorio.
        </div>
        <div *ngIf="emailInput.errors?.['email']">Ingrese un email válido.</div>
      </div>
    </div>

    <!-- Contraseña -->
    <div class="mb-3">
      <label for="password" class="form-label">Contraseña:</label>
      <input
        id="password"
        type="password"
        class="form-control"
        [(ngModel)]="password"
        name="password"
        required
        minlength="6"
        #passwordInput="ngModel"
        [disabled]="blocked || loading"
        [class.is-invalid]="passwordInput.invalid && passwordInput.touched"
        data-testid="password-input"
      />
      <div
        *ngIf="passwordInput.invalid && passwordInput.touched"
        class="invalid-feedback"
      >
        <div *ngIf="passwordInput.errors?.['required']">
          La contraseña es obligatoria.
        </div>
        <div *ngIf="passwordInput.errors?.['minlength']">
          La contraseña debe tener al menos 6 caracteres.
        </div>
      </div>
    </div>

    <!-- CAPTCHA -->
    <div class="mb-3">
      <re-captcha
        #captchaRef
        siteKey="6LdtnQgsAAAAADyOWrGO8X8anfXNOyLPCOZKFLue"
        (resolved)="onCaptchaResolved($event)"
        [ngClass]="{ 'opacity-50': blocked }"
        data-testid="captcha"
      ></re-captcha>
    </div>

    <!-- Botón -->
    <button
      type="submit"
      class="btn btn-primary w-100"
      [disabled]="loginForm.invalid || loading || !captchaToken || blocked"
      data-testid="submit-button"
    >
      <span
        *ngIf="loading"
        class="spinner-border spinner-border-sm me-2"
        role="status"
        aria-hidden="true"
      ></span>

      <!-- Cambia el texto si está bloqueado -->
      <ng-container *ngIf="!blocked; else blockedMsg"> Ingresar </ng-container>

      <ng-template #blockedMsg> Espera {{ blockSeconds }}s… </ng-template>
    </button>
  </form>
</div>
