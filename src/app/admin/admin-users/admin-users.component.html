<div class="container py-5">
  <div class="bg-white p-4 rounded">
    <h2 class="text-center text-primary mb-4 fw-bold">Gestión de Usuarios</h2>

    <!-- Mensajes -->
    <div *ngIf="success" class="alert alert-success">{{ success }}</div>
    <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

    <!-- Crear nuevo usuario -->
    <div class="border rounded mb-4 p-4 shadow-sm">
      <h5 class="mb-3 fw-semibold">Crear nuevo usuario</h5>
      <form (ngSubmit)="createUser()" class="row g-3 align-items-end">
        <div class="col-md-3">
          <label for="newName" class="form-label fw-semibold">
            <i class="bi bi-person-fill me-1"></i> Nombre
          </label>
          <input
            id="newName"
            type="text"
            class="form-control form-control-lg"
            placeholder="Ej: Juan Pérez"
            [(ngModel)]="newUser.name"
            name="name"
            required
          />
        </div>
        
        <div class="col-md-3">
          <label for="newEmail" class="form-label fw-semibold">
            <i class="bi bi-envelope-at-fill me-1"></i> Email
          </label>
          <input
            id="newEmail"
            type="email"
            class="form-control form-control-lg"
            placeholder="ejemplo@correo.com"
            [(ngModel)]="newUser.email"
            name="email"
            required
          />
        </div>
       
        <div class="col-md-3">
          <label for="newPassword" class="form-label fw-semibold">
            <i class="bi bi-lock-fill me-1"></i> Contraseña
          </label>
          <input
            id="newPassword"
            type="password"
            class="form-control form-control-lg"
            placeholder="••••••••"
            [(ngModel)]="newUser.password"
            name="password"
            required
          />
        </div>
        
        <div class="col-md-3">
          <label for="newRole" class="form-label fw-semibold">
            <i class="bi bi-tag-fill me-1"></i> Rol
          </label>
          <select
            id="newRole"
            class="form-select form-select-lg"
            [(ngModel)]="newUser.role"
            name="role"
            required
          >
            <option value="user">Usuario</option>
            <option value="admin">Administrador</option>
          </select>
        </div>
        
        <div class="mt-3 text-center">
          <button 
            type="submit" 
            class="btn btn-lg btn-primary px-5 fw-bold"
          >
          Crear Usuario
          </button>
        </div>
      </form>
    </div>
    
    <!-- Tabla de usuarios -->
    <div class="card shadow-sm">
      <div class="table-responsive">
        <div class="card-header bg-primary text-white">
          <h5 class="mb-0">Listado de Usuarios</h5>
        </div>
        <table class="table table-striped align-middle mb-0 table-bordered">
          <thead class="table-light">
            <tr class="text-center">
              <th>Nombre</th>
              <th>Email</th>
              <th>Rol</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let user of users">
              <ng-container
                *ngIf="editUser && editUser.id === user.id; else normalView"
              >
                <td>
                  <input
                    [(ngModel)]="editUser.name"
                    name="editName"
                    class="form-control"
                  />
                </td>
                <td>
                  <input
                    [(ngModel)]="editUser.email"
                    name="editEmail"
                    type="email"
                    class="form-control"
                  />
                </td>
                <td>
                  <select
                    [(ngModel)]="editUser.role"
                    name="editRole"
                    class="form-select"
                  >
                    <option value="user">Usuario</option>
                    <option value="admin">Administrador</option>
                  </select>
                </td>
                <td class="text-center">
                  <button
                    class="btn btn-sm btn-outline-success me-2 fw-semibold"
                    (click)="updateUser()"
                  >
                    Guardar
                  </button>
                  <button
                    class="btn btn-sm btn-outline-secondary fw-semibold"
                    (click)="cancelEdit()"
                  >
                    Cancelar
                  </button>
                </td>
              </ng-container>

              <ng-template #normalView>
                <td class="fw-semibold">{{ user.name }}</td>
                <td>{{ user.email }}</td>
                <td class="text-capitalize">{{ user.role }}</td>
                <td class="text-center">
                  <button
                    class="btn btn-sm btn-outline-warning me-2 fw-semibold"
                    (click)="edit(user)"
                  >
                    Editar
                  </button>
                  <button
                    class="btn btn-sm btn-outline-danger fw-semibold"
                    (click)="deleteUser(user.id)"
                  >
                    Desactivar
                  </button>
                </td>
              </ng-template>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
