<div class="container py-5">
  <div class="bg-white p-4 rounded shadow-sm">
    <h2 class="text-center text-primary mb-4">Gestión de Categorías</h2>

    <!-- Crear nueva categoría -->
    <div class="row g-3 align-items-end mb-4">
      <div class="col-md-9">
        <label for="newCategory" class="form-label">Nueva categoría</label>
        <input
          id="newCategory"
          type="text"
          [(ngModel)]="newCategoryName"
          class="form-control"
          placeholder="Ej: Tablets"
        />
      </div>
      <div class="col-md-3 text-end">
        <button
          class="btn btn-success w-100 fw-bold"
          (click)="createCategory()"
        >
          Crear
        </button>
      </div>
    </div>
  </div>

  <!-- Tabla de categorías -->
  <div *ngIf="categories.length" class="mt-5">
    <div class="card shadow-sm">
      <div class="card-header bg-primary text-white">
        <h5 class="mb-0">Listado de Categorías</h5>
      </div>
      <div class="table-responsive">
        <table class="table table-striped align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th class="text-center">Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let cat of categories">
              <td>{{ cat.id }}</td>

              <!-- Edición -->
              <td *ngIf="editingCategory?.id === cat.id">
                <input
                  type="text"
                  [(ngModel)]="updatedName"
                  class="form-control"
                />
              </td>

              <!-- Lectura -->
              <td *ngIf="editingCategory?.id !== cat.id" class="fw-semibold">
                {{ cat.name }}
              </td>

              <td class="text-center">
                <!-- Modo edición -->
                <ng-container
                  *ngIf="editingCategory?.id === cat.id; else normalRows"
                >
                  <button
                    class="btn btn-sm btn-outline-primary me-2"
                    (click)="saveEdit()"
                  >
                    Guardar
                  </button>
                  <button
                    class="btn btn-sm btn-outline-secondary"
                    (click)="cancelEdit()"
                  >
                    Cancelar
                  </button>
                </ng-container>

                <ng-template #normalRows>
                  <button
                    class="btn btn-sm btn-outline-warning me-2"
                    (click)="startEdit(cat)"
                  >
                    Editar
                  </button>

                  <!-- 🔥 ELIMINAR CON MODAL -->
                  <button
                    class="btn btn-sm btn-outline-danger"
                    (click)="askDeleteCategory(cat.id)"
                  >
                    Eliminar
                  </button>
                </ng-template>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- ============================= -->
<!-- MODAL UNIVERSAL DE CONFIRMACIÓN -->
<!-- ============================= -->
<app-confirm-modal
  *ngIf="showModal"
  [title]="modalTitle"
  [message]="modalMessage"
  (onConfirm)="confirmModal()"
  (onCancel)="cancelModal()"
></app-confirm-modal>
