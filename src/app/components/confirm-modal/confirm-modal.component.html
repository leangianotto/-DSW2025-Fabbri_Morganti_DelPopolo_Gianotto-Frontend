<div class="modal-backdrop">
  <div class="modal-container">
    <h3 class="modal-title">{{ title }}</h3>

    <p class="modal-message">
      {{ message }}
    </p>

    <div class="modal-actions">
      <button class="btn cancel" data-testid="cancel-button" (click)="cancel()">Cancelar</button>
      <button class="btn confirm" data-testid="confirm-button" (click)="confirm()">Confirmar</button>
    </div>
  </div>
</div>
